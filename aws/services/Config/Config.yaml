AWSTemplateFormatVersion: '2010-09-09'
Metadata: 
  License: Apache-2.0
Description: 'AWS CloudFormation Sample Template Config: This template demonstrates
  the usage of AWS Config resources. **WARNING** You will be billed for the AWS resources
  used if you create a stack from this template.'
Parameters:
  DeliveryChannelExists:
    Type: String
    Description: 'Do you have an exisiting AWS Config delivery channel?'
    Default: 'false'
    AllowedValues: ['false', 'true']
  Ec2VolumeAutoEnableIO:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
  Ec2VolumeTagKey:
    Type: String
    Default: CostCenter
Conditions:
  CreateDeliveryChannel: !Equals [ !Ref DeliveryChannelExists, 'false' ]
Resources:
  Ec2Volume:
    Type: AWS::EC2::Volume
    Properties:
      AutoEnableIO: !Ref 'Ec2VolumeAutoEnableIO'
      Size: '5'
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
      - Key: !Ref 'Ec2VolumeTagKey'
        Value: Ec2VolumeTagValue
  ConfigRecorder:
    Type: AWS::Config::ConfigurationRecorder
    Properties:
      Name: default
      RecordingGroup:
        ResourceTypes: ['AWS::EC2::Volume']
      RoleARN: !GetAtt [ConfigRole, Arn]
  DeliveryChannel:
    Condition: CreateDeliveryChannel
    Type: AWS::Config::DeliveryChannel
    Properties:
      ConfigSnapshotDeliveryProperties:
        DeliveryFrequency: Six_Hours
      S3BucketName: !Ref 'ConfigBucket'
      SnsTopicARN: !Ref 'ConfigTopic'
  ConfigBucket:
    Type: AWS::S3::Bucket
  ConfigTopic:
    Type: AWS::SNS::Topic
  ConfigTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      PolicyDocument:
        Id: ConfigTopicPolicy
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: config.amazonaws.com
          Action: SNS:Publish
          Resource: '*'
      Topics: [!Ref 'ConfigTopic']
  ConfigRuleForVolumeTags:
    Type: AWS::Config::ConfigRule
    Properties:
      InputParameters:
        tag1Key: CostCenter
      Scope:
        ComplianceResourceTypes: ['AWS::EC2::Volume']
      Source:
        Owner: AWS
        SourceIdentifier: REQUIRED_TAGS
    DependsOn: ConfigRecorder
  ConfigRuleForVolumeAutoEnableIO:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: ConfigRuleForVolumeAutoEnableIO
      Scope:
        ComplianceResourceId: !Ref 'Ec2Volume'
        ComplianceResourceTypes: ['AWS::EC2::Volume']
      Source:
        Owner: CUSTOM_LAMBDA
        SourceDetails:
        - EventSource: aws.config
          MessageType: ConfigurationItemChangeNotification
        SourceIdentifier: !GetAtt [VolumeAutoEnableIOComplianceCheck, Arn]
    DependsOn: [ConfigPermissionToCallLambda, ConfigRecorder]
  ConfigPermissionToCallLambda:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt [VolumeAutoEnableIOComplianceCheck, Arn]
      Action: lambda:InvokeFunction
      Principal: config.amazonaws.com
  VolumeAutoEnableIOComplianceCheck:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        ZipFile: !Sub |
          const { ConfigServiceClient, PutEvaluationsCommand } = require('@aws-sdk/client-config-service');
          const { EC2Client, DescribeVolumeAttributeCommand } = require('@aws-sdk/client-ec2');
          const config = new ConfigServiceClient();
          const ec2 = new EC2Client();
          exports.handler = async function(event, context) {
              const compliance = await evaluateCompliance(event);
              const configurationItem = JSON.parse(event.invokingEvent).configurationItem;
              const putEvaluationsRequest = {
                  Evaluations: [{
                      ComplianceResourceType: configurationItem.resourceType,
                      ComplianceResourceId: configurationItem.resourceId,
                      ComplianceType: compliance,
                      OrderingTimestamp: configurationItem.configurationItemCaptureTime
                  }],
                  ResultToken: event.resultToken
              };
              return await config.send(new PutEvaluationsCommand(putEvaluationsRequest));
          };
          async function evaluateCompliance(event) {
              const configurationItem = JSON.parse(event.invokingEvent).configurationItem;
              const status = configurationItem.configurationItemStatus;
              if (configurationItem.resourceType !== 'AWS::EC2::Volume' || event.eventLeftScope || (status !== 'OK' && status !== 'ResourceDiscovered'))
                  return 'NOT_APPLICABLE';
              const data = await ec2.send(new DescribeVolumeAttributeCommand({VolumeId: configurationItem.resourceId, Attribute: 'autoEnableIO'}));
              if (data.AutoEnableIO.Value) return 'COMPLIANT';
              else return 'NON_COMPLIANT';
          }
      Handler: index.handler
      Runtime: nodejs24.x
      Timeout: '30'
      Role: !GetAtt [LambdaExecutionRole, Arn]
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: [lambda.amazonaws.com]
          Action: ['sts:AssumeRole']
      Policies:
      - PolicyName: root
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: ['logs:*', 'config:PutEvaluations', 'ec2:DescribeVolumeAttribute']
            Resource: '*'
  ConfigRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: [config.amazonaws.com]
          Action: ['sts:AssumeRole']
      ManagedPolicyArns: ['arn:aws:iam::aws:policy/service-role/AWSConfigRole']
      Policies:
      - PolicyName: root
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: s3:GetBucketAcl
            Resource: !Join ['', ['arn:aws:s3:::', !Ref 'ConfigBucket']]
          - Effect: Allow
            Action: s3:PutObject
            Resource: !Join ['', ['arn:aws:s3:::', !Ref 'ConfigBucket', /AWSLogs/,
                !Ref 'AWS::AccountId', /*]]
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
          - Effect: Allow
            Action: config:Put*
            Resource: '*'
Outputs:
  ConfigRuleForVolumeTagsArn:
    Value: !GetAtt [ConfigRuleForVolumeTags, Arn]
  ConfigRuleForVolumeTagsConfigRuleId:
    Value: !GetAtt [ConfigRuleForVolumeTags, ConfigRuleId]
  ConfigRuleForVolumeAutoEnableIOComplianceType:
    Value: !GetAtt [ConfigRuleForVolumeAutoEnableIO, Compliance.Type]
